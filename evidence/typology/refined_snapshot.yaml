id: gitboard
scope:
    modules:
        - .
slices:
    - id: board
      objective: Provides shared data structures for dashboard state and forge synchronization.
      owns:
        - id: internal-board
          path: internal/board
          layer: domain
    - id: cliexec
      objective: Provides a standardized interface for executing system commands and shell processes.
      owns:
        - id: internal-cliexec
          path: internal/cliexec
          layer: domain
    - id: dashboard
      objective: Orchestrates data from adapters and local state to provide a unified project view.
      owns:
        - id: internal-dashboard
          path: internal/dashboard
          layer: domain
    - id: gitboard
      objective: Serves as the primary entrypoint for the Gitboard CLI and local dashboard server.
      owns:
        - id: internal-observability
          path: internal/observability
          layer: domain
        - id: internal-syncproj
          path: internal/syncproj
          layer: domain
      surfaces:
        - id: gitboard-cli
          kind: cli
          components:
            - id: cmd-gitboard
              path: cmd/gitboard
        - id: gitboard-server
          kind: api
          components:
            - id: internal-server
              path: internal/server
    - id: llm
      objective: Provides an OpenAI-compatible client for automated code and triage analysis.
      owns:
        - id: internal-llm
          path: internal/llm
          layer: domain
    - id: localgit
      objective: Acts as an adapter for performing local git filesystem operations and inspections.
      owns:
        - id: internal-localgit
          path: internal/localgit
          layer: domain
    - id: remotegit
      objective: Acts as an adapter for interacting with GitHub and GitLab remote APIs.
      owns:
        - id: internal-remotegit
          path: internal/remotegit
          layer: domain
    - id: pruneagent
      objective: Executes automated investigations into removable local branches.
      owns:
        - id: internal-pruneagent
          path: internal/pruneagent
          layer: domain
    - id: triage
      objective: Provides DTOs and logic for analyzing and summarizing triage requests.
      owns:
        - id: internal-triage
          path: internal/triage
          layer: domain
libraries:
    - id: config
      purpose: Shared technical package for application configuration management.
      owns:
        - id: internal-config
          path: internal/config
          layer: domain
sliceBindings:
    - from: dashboard
      to: board
      kind: reads
    - from: dashboard
      to: config
      kind: reads
    - from: dashboard
      to: localgit
      kind: reads
    - from: dashboard
      to: remotegit
      kind: reads
    - from: localgit
      to: cliexec
      kind: reads
    - from: triage
      to: config
      kind: reads
    - from: triage
      to: llm
      kind: reads
    - from: llm
      to: config
      kind: reads
    - from: pruneagent
      to: cliexec
      kind: reads
    - from: pruneagent
      to: llm
      kind: reads
    - from: pruneagent
      to: localgit
      kind: reads
    - from: remotegit
      to: board
      kind: reads
    - from: remotegit
      to: cliexec
      kind: reads
    - from: remotegit
      to: config
      kind: reads
    - from: gitboard
      to: cliexec
      kind: reads
    - from: gitboard
      to: config
      kind: reads
    - from: gitboard
      to: dashboard
      kind: reads
    - from: gitboard
      to: llm
      kind: reads
    - from: gitboard
      to: localgit
      kind: reads
    - from: gitboard
      to: pruneagent
      kind: reads
    - from: gitboard
      to: remotegit
      kind: reads
    - from: gitboard
      to: triage
      kind: reads

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gitboard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>Gitboard</h1>
        <p class="lede">GitLab and GitHub project health in one pane. Uses <code>glab</code>, <code>gh</code>, and local <code>git</code> on your machine.</p>
      </div>
      <div class="toolbar">
        <div class="toolbar-actions">
          <button id="refresh" type="button" title="Bypass upstream cache and reload">Refresh</button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <div id="tooling" class="tooling" aria-live="polite"></div>
        </div>
        <div class="toolbar-meta">
          <span id="poll-label" class="poll-label" aria-live="polite">every 30s</span>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
    <div class="filters" role="search" aria-label="Filter projects">
      <label class="filter-search">
        <span class="visually-hidden">Search</span>
        <input id="filter-q" type="search" placeholder="Search project, path, branch…" autocomplete="off" />
      </label>
      <div class="filter-chips" role="radiogroup" aria-label="Attention filters">
        <button type="button" class="filter-chip" data-filter="ci_failed" aria-pressed="false">Failed CI</button>
        <button type="button" class="filter-chip" data-filter="open_review" aria-pressed="false">Open review</button>
        <button type="button" class="filter-chip" data-filter="dirty" aria-pressed="false">Dirty</button>
        <button type="button" class="filter-chip" data-filter="prune" aria-pressed="false">Prune</button>
        <button type="button" class="filter-chip" data-filter="conflicts" aria-pressed="false">Conflicts</button>
      </div>
      <div class="filter-scope" id="filter-scope">
        <button type="button" id="filter-scope-btn" class="filter-scope-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="filter-scope-menu">
          <span id="filter-scope-label">All hosts / orgs</span>
        </button>
        <div id="filter-scope-menu" class="filter-scope-menu" role="listbox" aria-label="Host / org" aria-multiselectable="true" hidden></div>
      </div>
      <button type="button" id="filter-clear" class="filter-clear" hidden>Clear</button>
      <span id="filter-count" class="filter-count" aria-live="polite"></span>
    </div>
  </header>
  <main>
    <table class="board" id="board">
      <thead>
        <tr>
          <th>Project</th>
          <th title="Remote branches aligned with local checkouts / worktrees, plus per-branch CI">Branches</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-modal-dismiss></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <pre id="modal-detail" class="modal-detail" hidden></pre>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="modal-btn modal-btn--ghost"></button>
        <button type="button" id="modal-confirm" class="modal-btn modal-btn--danger"></button>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>

name: Auto patch release

# Cuts vX.Y.(Z+1) after each releasable merge to main and publishes it with
# GoReleaser in the same job. Tags pushed by GITHUB_TOKEN do not start
# release.yml, which stays for human-pushed tags.
# Skip rules live in scripts/auto-patch-decide.sh (docs/chore/ci-only ranges,
# agent-harness-only paths, packaging-only paths, [skip release]).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: auto-patch-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the tag and create the GitHub Release.
      contents: write
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      new_tag: ${{ steps.decide.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the decide script reads every commit since the last v*.
          fetch-depth: 0

      - name: Decide whether to tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          # .cursor holds the cursor-packs gitlink and local agent rules.
          AUTO_PATCH_EXTRA_HARNESS_PATHS: ".cursor/* .cursor/packs/shared"
        run: bash scripts/auto-patch-decide.sh

      - name: Skip notice
        if: steps.decide.outputs.skip == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: echo "Skipping auto release - ${REASON}"

      - uses: actions/setup-go@v6
        if: steps.decide.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Create and push tag
        if: steps.decide.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.decide.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        if: steps.decide.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Release assets exist for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ needs.release.outputs.new_tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${NEW_TAG}" -R "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "${assets}"
          echo "${assets}" | grep -qx checksums.txt
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            echo "${assets}" | grep -q "_${target}\." || { echo "missing archive for ${target}" >&2; exit 1; }
          done

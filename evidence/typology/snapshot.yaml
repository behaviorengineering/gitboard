id: gitboard-refined
scope:
    modules:
        - .
slices:
    - id: gitboard
      objective: Acts as the command-line entrypoint to orchestrate the gitboard application.
      surfaces:
        - id: gitboard-cli
          kind: cli
          components:
            - id: cmd-gitboard
              path: cmd/gitboard
    - id: dto/board
      objective: Provide JSON data types shared across the dashboard UI, forge adapters, and server handlers.
      owns:
        - id: internal-board
          path: internal/board
          layer: domain
    - id: runner
      objective: Executes external processes via the os/exec package.
      owns:
        - id: internal-cliexec
          path: internal/cliexec
          layer: domain
    - id: dashboard
      objective: The dashboard package aggregates various views and investigation results for the system.
      owns:
        - id: internal-dashboard
          path: internal/dashboard
          layer: domain
    - id: git
      objective: Provides clients for interacting with remote Git forge APIs like GitHub and GitLab.
      owns:
        - id: internal-localgit
          path: internal/localgit
          layer: domain
        - id: internal-remotegit
          path: internal/remotegit
          layer: domain
    - id: llm
      objective: Provides an OpenAI-compatible chat completions client.
      owns:
        - id: internal-llm
          path: internal/llm
          layer: domain
    - id: observability
      objective: Bootstraps OTEL and manages error-only inference dumps.
      owns:
        - id: internal-observability
          path: internal/observability
          layer: domain
    - id: analysis
      objective: Analyzes project and job data to produce triage responses.
      owns:
        - id: internal-pruneagent
          path: internal/pruneagent
          layer: domain
        - id: internal-triage
          path: internal/triage
          layer: domain
    - id: server
      objective: Provides an HTTP server interface and mux routing for the application.
      surfaces:
        - id: server-ui
          kind: ui
          components:
            - id: internal-server
              path: internal/server
    - id: syncproj
      objective: Aggregates views for project discovery and selection.
      owns:
        - id: internal-syncproj
          path: internal/syncproj
          layer: domain
libraries:
    - id: config
      purpose: Shared technical package without domain knowledge
      owns:
        - id: internal-config
          path: internal/config
          layer: domain
sliceBindings:
    - from: gitboard
      to: runner
      kind: reads
    - from: gitboard
      to: config
      kind: reads
    - from: gitboard
      to: dashboard
      kind: reads
    - from: gitboard
      to: llm
      kind: reads
    - from: gitboard
      to: git
      kind: reads
    - from: gitboard
      to: observability
      kind: reads
    - from: gitboard
      to: analysis
      kind: reads
    - from: gitboard
      to: server
      kind: reads
    - from: gitboard
      to: syncproj
      kind: reads
    - from: dashboard
      to: dto/board
      kind: reads
    - from: dashboard
      to: config
      kind: reads
    - from: dashboard
      to: git
      kind: reads
    - from: llm
      to: config
      kind: reads
    - from: git
      to: dto/board
      kind: reads
    - from: git
      to: runner
      kind: reads
    - from: git
      to: config
      kind: reads
    - from: server
      to: config
      kind: reads
    - from: server
      to: dashboard
      kind: reads
    - from: server
      to: analysis
      kind: reads
    - from: syncproj
      to: config
      kind: reads
    - from: syncproj
      to: git
      kind: reads
    - from: analysis
      to: config
      kind: reads
    - from: analysis
      to: llm
      kind: reads

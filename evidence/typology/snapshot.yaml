id: gitboard
scope:
    modules:
        - .
slices:
    - id: gitboard
      objective: Provides the primary command-line interface and orchestrates core gitboard operations.
      owns:
        - id: internal-observability
          path: ./internal/observability
          layer: domain
        - id: internal-syncproj
          path: ./internal/syncproj
          layer: domain
      surfaces:
        - id: gitboard-cli
          kind: cli
          components:
            - id: cmd-gitboard
              path: ./cmd/gitboard
            - id: internal-server
              path: ./internal/server
    - id: board
      objective: Manages the core domain logic for project state and board representation.
      owns:
        - id: internal-board
          path: ./internal/board
          layer: domain
    - id: config
      objective: Provides centralized configuration management for the entire system.
      owns:
        - id: internal-config
          path: ./internal/config
          layer: domain
    - id: dashboard
      objective: Serves as the web-based visualization layer for project and board data.
      surfaces:
        - id: dashboard-ui
          kind: ui
          components:
            - id: internal-dashboard
              path: ./internal/dashboard
    - id: git
      objective: Handles all local and remote git repository interactions and state synchronization.
      owns:
        - id: internal-localgit
          path: ./internal/localgit
          layer: domain
        - id: internal-remotegit
          path: ./internal/remotegit
          layer: domain
    - id: llm
      objective: Provides intelligent analysis capabilities through large language model integration.
      owns:
        - id: internal-llm
          path: ./internal/llm
          layer: domain
    - id: pruneagent
      objective: Automates the identification and execution of project cleanup tasks.
      owns:
        - id: internal-pruneagent
          path: ./internal/pruneagent
          layer: domain
    - id: triage
      objective: Analyzes project data to categorize and prioritize maintenance actions.
      owns:
        - id: internal-triage
          path: ./internal/triage
          layer: domain
    - id: exec-utils
      objective: Provides low-level execution primitives and runners for command processing.
      owns:
        - id: internal-cliexec
          path: ./internal/cliexec
          layer: domain
sliceBindings:
    - from: gitboard
      to: config
      kind: reads
    - from: gitboard
      to: dashboard
      kind: reads
    - from: gitboard
      to: git
      kind: reads
    - from: gitboard
      to: llm
      kind: reads
    - from: gitboard
      to: pruneagent
      kind: reads
    - from: gitboard
      to: triage
      kind: reads
    - from: dashboard
      to: board
      kind: reads
    - from: dashboard
      to: config
      kind: reads
    - from: dashboard
      to: git
      kind: reads
    - from: git
      to: exec-utils
      kind: reads
    - from: pruneagent
      to: exec-utils
      kind: reads
    - from: pruneagent
      to: llm
      kind: reads
    - from: pruneagent
      to: git
      kind: reads
    - from: triage
      to: config
      kind: reads
    - from: triage
      to: llm
      kind: reads

id: gitboard
scope:
    modules:
        - .
slices:
    - id: board
      objective: Manages the visual representation and state of project boards for users.
      owns:
        - id: internal-board
          path: ./internal/board
          layer: domain
        - id: internal-config
          path: ./internal/config
          layer: domain
        - id: internal-llm
          path: ./internal/llm
          layer: domain
    - id: gitboard
      objective: Orchestrates the core CLI application, including orchestration, server, and observability.
      owns:
        - id: internal-cliexec
          path: ./internal/cliexec
          layer: domain
        - id: internal-observability
          path: ./internal/observability
          layer: domain
        - id: internal-syncproj
          path: ./internal/syncproj
          layer: domain
      surfaces:
        - id: gitboard-cli
          kind: cli
          components:
            - id: cmd-gitboard
              path: ./cmd/gitboard
            - id: internal-server
              path: ./internal/server
    - id: dashboard
      objective: Provides a web-based interface for interacting with project data and management tasks.
      surfaces:
        - id: dashboard-ui
          kind: ui
          components:
            - id: internal-dashboard
              path: ./internal/dashboard
    - id: localgit
      objective: Interfaces with the local filesystem to inspect and manage git worktrees and repositories.
      owns:
        - id: internal-localgit
          path: ./internal/localgit
          layer: domain
    - id: pruneagent
      objective: Automates the decision-making process for cleaning up stale project branches and resources.
      owns:
        - id: internal-pruneagent
          path: ./internal/pruneagent
          layer: domain
    - id: remotegit
      objective: Communicates with remote git providers to fetch and analyze repository state.
      owns:
        - id: internal-remotegit
          path: ./internal/remotegit
          layer: domain
    - id: triage
      objective: Analyzes project state to suggest necessary maintenance and cleanup actions.
      owns:
        - id: internal-triage
          path: ./internal/triage
          layer: domain
sliceBindings:
    - from: remotegit
      to: board
      kind: reads
    - from: gitboard
      to: dashboard
      kind: reads
    - from: gitboard
      to: localgit
      kind: reads
    - from: gitboard
      to: pruneagent
      kind: reads
    - from: gitboard
      to: remotegit
      kind: reads
    - from: gitboard
      to: triage
      kind: reads
    - from: dashboard
      to: board
      kind: reads
    - from: dashboard
      to: localgit
      kind: reads
    - from: dashboard
      to: remotegit
      kind: reads
    - from: pruneagent
      to: localgit
      kind: reads

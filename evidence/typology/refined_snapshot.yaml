id: gitboard
scope:
    modules:
        - .
slices:
    - id: board
      objective: Provides shared JSON data structures for cross-component state synchronization.
      owns:
        - id: internal-board
          path: internal/board
          layer: domain
    - id: cliexec
      objective: Manages the execution of external system processes and shell commands.
      owns:
        - id: internal-cliexec
          path: internal/cliexec
          layer: domain
    - id: dashboard
      objective: Aggregates local and remote git data into a unified view for user interaction.
      owns:
        - id: internal-dashboard
          path: internal/dashboard
          layer: domain
    - id: gitboard
      objective: Orchestrates the local code-change board via CLI and background synchronization.
      owns:
        - id: internal-observability
          path: internal/observability
          layer: domain
        - id: internal-syncproj
          path: internal/syncproj
          layer: domain
      surfaces:
        - id: gitboard-cli
          kind: cli
          components:
            - id: cmd-gitboard
              path: cmd/gitboard
    - id: llm
      objective: Provides OpenAI-compatible chat completion capabilities for automated triage.
      owns:
        - id: internal-llm
          path: internal/llm
          layer: domain
    - id: localgit
      objective: Interacts with the local filesystem to inspect and manage git worktrees and branches.
      owns:
        - id: internal-localgit
          path: internal/localgit
          layer: domain
    - id: pruneagent
      objective: Analyzes local branch state to identify candidates for removal.
      owns:
        - id: internal-pruneagent
          path: internal/pruneagent
          layer: domain
    - id: remotegit
      objective: Interfaces with GitHub and GitLab APIs to fetch remote repository metadata.
      owns:
        - id: internal-remotegit
          path: internal/remotegit
          layer: domain
    - id: server
      objective: Serves the dashboard web interface via an HTTP server.
      surfaces:
        - id: server-ui
          kind: ui
    - id: triage
      objective: Performs automated analysis of failed jobs and open items using LLM intelligence.
      owns:
        - id: internal-triage
          path: internal/triage
          layer: domain
    - id: gitboard-http
      objective: HTTP delivery surface separated from the CLI entrypoint.
      surfaces:
        - id: gitboard-http-ui
          kind: ui
          components:
            - id: internal-server
              path: internal/server
libraries:
    - id: config
      purpose: Provides shared configuration loading and access for the entire application.
      owns:
        - id: internal-config
          path: internal/config
          layer: domain
sliceBindings:
    - from: pruneagent
      to: cliexec
      kind: reads
    - from: pruneagent
      to: llm
      kind: reads
    - from: pruneagent
      to: localgit
      kind: reads
    - from: server
      to: config
      kind: reads
    - from: server
      to: dashboard
      kind: reads
    - from: server
      to: pruneagent
      kind: reads
    - from: server
      to: triage
      kind: reads
    - from: dashboard
      to: board
      kind: reads
    - from: dashboard
      to: config
      kind: reads
    - from: dashboard
      to: localgit
      kind: reads
    - from: dashboard
      to: remotegit
      kind: reads
    - from: localgit
      to: cliexec
      kind: reads
    - from: remotegit
      to: board
      kind: reads
    - from: remotegit
      to: cliexec
      kind: reads
    - from: remotegit
      to: config
      kind: reads
    - from: triage
      to: config
      kind: reads
    - from: triage
      to: llm
      kind: reads
    - from: gitboard
      to: cliexec
      kind: reads
    - from: gitboard
      to: config
      kind: reads
    - from: gitboard
      to: dashboard
      kind: reads
    - from: gitboard
      to: llm
      kind: reads
    - from: gitboard
      to: localgit
      kind: reads
    - from: gitboard
      to: pruneagent
      kind: reads
    - from: gitboard
      to: remotegit
      kind: reads
    - from: gitboard
      to: server
      kind: reads
    - from: gitboard
      to: triage
      kind: reads
    - from: llm
      to: config
      kind: reads
    - from: gitboard-http
      to: config
      kind: reads

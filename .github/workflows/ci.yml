name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so lint can compare against the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules tidy
        run: go mod tidy -diff

      - name: gofumpt
        run: |
          unformatted=$(go tool gofumpt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "gofumpt needed (go tool task format):"
            echo "$unformatted"
            exit 1
          fi

      # Lints only the lines a pull request changes. Drop --new-from-rev once the
      # older baseline is cleared, so the whole module is gated.
      - name: golangci-lint (new code)
        if: github.event_name == 'pull_request'
        run: go tool golangci-lint run --timeout 5m --new-from-rev "origin/${{ github.base_ref }}" ./cmd/... ./internal/... ./pkg/...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...
